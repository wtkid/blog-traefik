apiVersion: v1
kind: Service
metadata:
  name: traefik-dashboard-service

spec:
  type: LoadBalancer
  ports:
    - port: 8080
      # 指定一个nodeport的端口，防止随机分配，在loadBalancer服务没法用时，这个端口也可以访问，就不用再写一个nodeport的service了
      targetPort: dashboard
      nodePort: 30001
  selector:
    app: traefik

---
apiVersion: v1
kind: Service
metadata:
  name: traefik-web-service

spec:
  type: LoadBalancer
  ports:
    - targetPort: web
      # 指定一个nodeport的端口，防止随机分配，在loadBalancer服务没法用时，这个端口也可以访问，就不用再写一个nodeport的service了
      nodePort: 30080
      port: 80
  selector:
    app: traefik

